<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display User IDs and Workouts</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCIXtcjkj6kLTqwStdD7RtMCuiycrKBH0k",
      authDomain: "fitnessapp-f519f.firebaseapp.com",
      projectId: "fitnessapp-f519f",
      storageBucket: "fitnessapp-f519f.appspot.com",
      messagingSenderId: "1000735476286",
      appId: "1:1000735476286:web:4a62a875917834dd215f6f",
      measurementId: "G-MJ8K8ZNQM4"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadUserIDs() {
      try {
        console.log("Loading user IDs..."); // Отладочная информация
        const userWorkoutsRef = collection(db, "userWorkouts");
        const snapshot = await getDocs(userWorkoutsRef);
        let userIds = snapshot.docs.map(doc => {
          console.log(`Document ID: ${doc.id}, Data:`, doc.data()); // Отладочная информация
          return doc.id;
        });

        console.log("Loaded user IDs:", userIds); // Отладочная информация
        displayUserIDs(userIds);
      } catch (error) {
        console.error('Error loading user IDs:', error);
      }
    }

    async function loadWorkouts(userId) {
      try {
        console.log(`Loading workouts for user: ${userId}`); // Отладочная информация
        const workoutsRef = collection(db, "userWorkouts", userId, "workouts");
        const snapshot = await getDocs(workoutsRef);
        let workouts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

        console.log(`Loaded workouts for user ${userId}:`, workouts); // Отладочная информация
        return workouts;
      } catch (error) {
        console.error(`Error loading workouts for user ${userId}:`, error);
        return [];
      }
    }

    async function displayUserIDs(userIds) {
      const container = document.getElementById("user-ids-container");
      container.innerHTML = "<h2>User IDs and Workouts from Firestore</h2>";
      for (let userId of userIds) {
        const userElement = document.createElement("div");
        userElement.innerHTML = `<h3>User ID: ${userId}</h3>`;
        container.appendChild(userElement);

        const workouts = await loadWorkouts(userId);
        const workoutsElement = document.createElement("div");
        workoutsElement.innerHTML = "<h4>Workouts:</h4>";
        workouts.forEach(workout => {
          const workoutElement = document.createElement("div");
          workoutElement.innerHTML = `
            <p><strong>Workout ID:</strong> ${workout.id}</p>
            <p><strong>Workout Date:</strong> ${workout.date ? new Date(workout.date.seconds * 1000).toLocaleDateString("ru-RU") : "Дата не указана"}</p>
            <p><strong>Exercises:</strong></p>
            <ul>
              ${workout.exercises ? workout.exercises.map(exercise => `
                <li>
                  <strong>${exercise.exercisename || "Unnamed Exercise"}</strong>: 
                  ${exercise.weight || ""} кг, ${exercise.reps} повторений, ${exercise.sets} сета
                </li>
              `).join("") : "No exercises available"}
            </ul>
          `;
          workoutsElement.appendChild(workoutElement);
        });
        userElement.appendChild(workoutsElement);
      }
    }

    document.addEventListener("DOMContentLoaded", function () {
      loadUserIDs();
    });
  </script>
</head>
<body>
  <div id="user-ids-container"></div>
</body>
</html>
