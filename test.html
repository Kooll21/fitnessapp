<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Search</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/11.3.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.3.0/firebase-firestore.js"></script>
</head>
<body>

    <h1>Введите ID тренировки</h1>
    <input type="text" id="workout-id" placeholder="Например: K1TSfG6tFHBMcGRbqLgS" />
    <button id="load-button">Загрузить тренировку</button>

    <div id="workout-details"></div>

    <script>
        // Firebase конфигурация
        const firebaseConfig = {
            apiKey: "AIzaSyCIXtcjkj6kLTqwStdD7RtMCuiycrKBH0k",
            authDomain: "fitnessapp-f519f.firebaseapp.com",
            projectId: "fitnessapp-f519f",
            storageBucket: "fitnessapp-f519f.appspot.com",
            messagingSenderId: "1000735476286",
            appId: "1:1000735476286:web:4a62a875917834dd215f6f",
            measurementId: "G-MJ8K8ZNQM4"
        };

        // Инициализация Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Функция для получения всех userID
        async function getAllUserIDs() {
            const usersCollection = db.collection("userWorkouts");
            const usersSnapshot = await usersCollection.get();
            return usersSnapshot.docs.map(doc => doc.id);
        }

        // Функция поиска тренировки по Workout ID среди всех пользователей
        async function loadWorkoutDetails() {
            const workoutId = document.getElementById("workout-id").value.trim();
            if (!workoutId) {
                alert("Введите Workout ID!");
                return;
            }

            const userIDs = await getAllUserIDs();

            for (let userID of userIDs) {
                const workoutRef = db.collection("userWorkouts").doc(userID).collection("workouts").doc(workoutId);
                const workoutDoc = await workoutRef.get();

                if (workoutDoc.exists) {
                    displayWorkoutDetails(workoutDoc.data(), userID, workoutId);
                    return;
                }
            }

            alert("Тренировка не найдена!");
        }

        // Функция отображения деталей тренировки
        function displayWorkoutDetails(workoutData, userID, workoutId) {
            const container = document.getElementById("workout-details");
            container.innerHTML = `
                <h3>Детали тренировки</h3>
                <p><strong>Дата:</strong> ${new Date(workoutData.date.seconds * 1000).toLocaleDateString("ru-RU")}</p>
                <p><strong>User ID:</strong> ${userID}</p>
                <p><strong>Упражнения:</strong></p>
                <ul>
                    ${workoutData.exercises.map((exercise, index) => `
                        <li>
                            <strong>${exercise.exercisename || "Без названия"}</strong>: 
                            <input type="number" value="${exercise.weight || ""}" id="weight-${index}" /> кг
                            <span>${exercise.reps} повторений, ${exercise.sets} сета</span>
                        </li>
                    `).join("")}
                </ul>
                <button onclick="updateWorkout('${userID}', '${workoutId}')">Сохранить изменения</button>
            `;
        }

        // Функция обновления данных о тренировке
        async function updateWorkout(userID, workoutId) {
            const workoutRef = db.collection("userWorkouts").doc(userID).collection("workouts").doc(workoutId);
            const workoutDoc = await workoutRef.get();
            const workoutData = workoutDoc.data();

            workoutData.exercises.forEach((exercise, index) => {
                const weightInput = document.getElementById(weight-${index});
                exercise.weight = parseFloat(weightInput.value) || null;
            });

            await workoutRef.update({ exercises: workoutData.exercises });

            alert("Тренировка обновлена!");
        }

        // Делаем loadWorkoutDetails глобальной функцией
        window.loadWorkoutDetails = loadWorkoutDetails;
        window.updateWorkout = updateWorkout;

        // Навешиваем обработчик на кнопку (альтернативный способ вызова)
        document.getElementById("load-button").addEventListener("click", loadWorkoutDetails);
    </script>
</body>
</html>
