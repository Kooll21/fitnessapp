<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Fitness Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Навигационная панель -->
    <nav class="navbar">
        <div id="navbar-container"></div>
    </nav>

    <!-- Основной контент -->
    <div class="main-content">
        <header>
            <h1>Регистрация</h1>
            <p>Создайте аккаунт, чтобы начать своё фитнес-путешествие!</p>
        </header>

        <section class="content">
            <form id="register-form" class="feature-card">
                <h3>Введите данные</h3>
                <label for="email">Email:</label>
                <input type="email" id="email" required placeholder="example@domain.com">

                <label for="password">Пароль:</label>
                <input type="password" id="password" required placeholder="Минимум 6 символов">

                <button type="submit">Зарегистрироваться</button>
            </form>
            <p id="error-message" style="color: #e74c3c; text-align: center; margin-top: 15px;"></p>
        </section>

        <footer>
            <p>© 2025 Фитнес Приложение. Все права защищены.</p>
        </footer>
    </div>

    <!-- Скрипты -->
    <script type="module" src="auth.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-firestore.js";
        import { loadNavbar } from './auth.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCIXtcjkj6kLTqwStdD7RtMCuiycrKBH0k",
            authDomain: "fitnessapp-f519f.firebaseapp.com",
            projectId: "fitnessapp-f519f",
            storageBucket: "fitnessapp-f519f.appspot.com",
            messagingSenderId: "1000735476286",
            appId: "1:1000735476286:web:4a62a875917834dd215f6f",
            measurementId: "G-MJ8K8ZNQM4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.addEventListener("DOMContentLoaded", () => {
            loadNavbar(); // Загружаем навигационную панель
        });

        document.getElementById("register-form").addEventListener("submit", (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const errorMessage = document.getElementById("error-message");

            if (password.length < 6) {
                errorMessage.textContent = "Пароль должен содержать минимум 6 символов.";
                return;
            }

            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    return setDoc(doc(db, "users", user.uid), {
                        email: user.email,
                        role: "user"
                    }).then(() => user);
                })
                .then((user) => {
                    window.location.href = "admin.html";
                })
                .catch((error) => {
                    console.error("Ошибка:", error);
                    errorMessage.textContent = "Не удалось зарегистрироваться: " + error.message;
                });
        });
    </script>
</body>
</html>
