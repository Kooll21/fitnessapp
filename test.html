<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Page</title>
  <link rel="stylesheet" href="styles.css"> <!-- External CSS file -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- External Chart.js -->
</head>
<body>

  <!-- Placeholder for dynamic menu -->
  <div id="navbar-container"></div>

  <h1>Добро пожаловать в свой личный кабинет</h1>
  <div id="workouts-list"></div>

  <!-- Modal Popup for Workout Details -->
  <div id="overlay" onclick="closePopup()"></div>
  <div id="popup">
    <button class="close-btn" onclick="closePopup()">&times;</button>
    <div id="popup-content"></div>
  </div>

  <!-- Exercise History Modal -->
  <div id="history-popup">
    <button onclick="closeHistoryPopup()">Close</button>
    <h3>История упражнений</h3>
    <div id="exercise-history"></div>
    <canvas id="exerciseHistoryChart" width="400" height="200"></canvas>
  </div>

  <script src="admin.js" type="module"></script> <!-- External JS file -->

</body>
</html>
