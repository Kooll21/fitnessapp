<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Page</title>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-firestore.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div id="navbar-container"></div>
    </nav>

    <div class="sidebar">
        <div class="sidebar-header">
            <h3>Dashboard</h3>
        </div>
        <ul class="sidebar-menu">
            <li><button id="workouts-button"><i class="fas fa-dumbbell"></i> Workouts</button></li>
            <li><button id="users-button"><i class="fas fa-users"></i> Users</button></li>
            <li><button id="exercises-button"><i class="fas fa-running"></i> Exercises</button></li>
            <li><button id="add-workout-button" style="display: none;"><i class="fas fa-plus"></i> Add Workout</button></li>
        </ul>
        <div class="sidebar-footer"></div>
    </div>

    <div class="main-content">
        <div id="workouts-content" style="display: block;">
            <h1>Добро пожаловать в свой личный кабинет</h1>
            <div id="workouts-list"></div>
        </div>
        <div id="users-content" style="display: none;">
            <h2>Управление пользователями</h2>
        </div>
        <div id="exercises-content" style="display: none;">
            <h2>Exercises Management</h2>
            <button onclick="testFirestoreConnection('ex-status', 'ex-fileCount', 'ex-documentList')">Проверить подключение</button>
            <p id="ex-status"></p>
            <p id="ex-fileCount"></p>
            <ul id="ex-documentList"></ul>
        </div>
    </div>

    <div id="overlay" onclick="closePopup()"></div>
    <div id="popup">
        <button class="close-btn" onclick="closePopup()">×</button>
        <div id="popup-content"></div>
    </div>
    <div id="history-popup">
        <button onclick="closeHistoryPopup()">Close</button>
        <h3>История упражнений</h3>
        <div id="exercise-history"></div>
        <canvas id="exerciseHistoryChart" width="400" height="200"></canvas>
    </div>

    <div id="add-workout-popup" style="display: none;">
        <button class="close-btn" onclick="closeAddWorkoutPopup()">×</button>
        <div id="add-workout-content">
            <h3>Добавить новое упражнение</h3>
            <form id="exerciseForm">
                <label for="category">Категория (группа мышц):</label>
                <select id="category">
                    <option value="Chest">Грудь</option>
                    <option value="Biceps">Бицепс</option>
                    <option value="Back">Спина</option>
                    <option value="Legs">Ноги</option>
                    <option value="Shoulders">Плечи</option>
                    <option value="Triceps">Трицепс</option>
                </select>
                <br><br>

                <label for="exerciseName">Название упражнения:</label>
                <input type="text" id="exerciseName" required><br><br>

                <label for="exerciseType">Тип упражнения:</label>
                <input type="text" id="exerciseType"><br><br>

                <label for="sets">Количество подходов:</label>
                <input type="text" id="sets"><br><br>

                <label for="reps">Количество повторений:</label>
                <input type="text" id="reps"><br><br>

                <label for="muscle">Основная мышца:</label>
                <input type="text" id="muscle"><br><br>

                <label for="muscleTypeAdditional">Доп. мышцы:</label>
                <input type="text" id="muscleTypeAdditional"><br><br>

                <label for="videoUrl">Ссылка на видео (YouTube):</label>
                <input type="url" id="videoUrl"><br><br>

                <label for="photoUrl">Ссылка на фото:</label>
                <input type="url" id="photoUrl"><br><br>

                <label for="description">Описание упражнения:</label><br>
                <textarea id="description" rows="4" cols="40"></textarea><br><br>

                <button type="button" id="submitExercise">Добавить упражнение</button>
            </form>
        </div>
    </div>

    <script type="module" src="auth.js"></script>
    <script type="module" src="admin.js"></script>
</body>
</html>
