<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Page</title>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCIXtcjkj6kLTqwStdD7RtMCuiycrKBH0k",
      authDomain: "fitnessapp-f519f.firebaseapp.com",
      projectId: "fitnessapp-f519f",
      storageBucket: "fitnessapp-f519f.appspot.com",
      messagingSenderId: "1000735476286",
      appId: "1:1000735476286:web:4a62a875917834dd215f6f",
      measurementId: "G-MJ8K8ZNQM4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    function checkAuthState() {
      const adminButton = document.getElementById("admin-panel");
      const userStatus = document.getElementById("user-status");
      const loginLink = document.getElementById("login-link");
      const logoutBtn = document.getElementById("logout-btn");

      onAuthStateChanged(auth, async (user) => {
        if (user) {
          userStatus.textContent = `Welcome, ${user.email}`;
          loginLink.style.display = 'none';
          logoutBtn.style.display = 'block';
          adminButton.style.display = 'block';
          await loadUserWorkouts(user.uid);
        } else {
          userStatus.textContent = 'Please log in';
          loginLink.style.display = 'inline-block';
          logoutBtn.style.display = 'none';
          adminButton.style.display = 'none';
        }
      });
    }

    window.logoutUser = function() {
      signOut(auth)
        .then(() => {
          document.getElementById("user-status").textContent = 'Please log in';
          document.getElementById("login-link").style.display = 'inline-block';
          document.getElementById("logout-btn").style.display = 'none';
          document.getElementById("admin-panel").style.display = 'none';
        })
        .catch((error) => {
          console.error('Error logging out:', error);
        });
    };

    async function loadUserWorkouts(userId) {
      const userWorkoutsRef = collection(db, "userWorkouts", userId, "workouts");
      const snapshot = await getDocs(userWorkoutsRef);
      let workouts = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));

      for (let workout of workouts) {
        workout.exercises = await loadExercises(workout.id); // Assuming you want to load exercises by workout ID
      }

      displayWorkouts(workouts);
    }

    async function loadExercises(workoutId) {
      const exercisesRef = collection(db, "userWorkouts", auth.currentUser.uid, "workouts", workoutId, "exercises");
      const snapshot = await getDocs(exercisesRef);
      const exercises = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
      return exercises;
    }

    function displayWorkouts(workouts) {
      const container = document.getElementById("workouts-list");
      container.innerHTML = "<h2>Saved Workouts</h2>";
      workouts.forEach((workout, index) => {
        const workoutElement = document.createElement("div");
        workoutElement.innerHTML = 
          `<p><strong>№ ${index + 1}:</strong> ${new Date(workout.date.seconds * 1000).toLocaleDateString("ru-RU")}</p>
          <button onclick="showWorkoutDetails(${index})">Подробнее</button>`;
        workoutElement.dataset.details = JSON.stringify(workout);
        container.appendChild(workoutElement);
      });
    }

    window.showWorkoutDetails = function(index) {
      const workout = JSON.parse(document.getElementById("workouts-list").children[index].dataset.details);
      displayWorkoutDetails(workout);
    };

    function displayWorkoutDetails(workoutData) {
      const exercisesList = workoutData.exercises.map((exercise, index) => `
        <li>
          ${exercise.name} - 
          <input type="number" id="weight-${index}" value="${exercise.weight}" placeholder="Weight">
          <input type="hidden" id="exercise-id-${index}" value="${exercise.id}">
        </li>
      `).join("");

      document.getElementById("popup-content").innerHTML = 
        `<h3>Workout Details</h3>
        <p><strong>Date:</strong> ${new Date(workoutData.date.seconds * 1000).toLocaleDateString("ru-RU")}</p>
        <p><strong>Exercises:</strong></p>
        <ul>${exercisesList}</ul>
        <button onclick="updateWeights('${workoutData.id}', ${workoutData.exercises.length})">Сохранить изменения</button>`;

      document.body.classList.add("modal-open");
      document.getElementById("overlay").style.display = "block";
      document.getElementById("popup").style.display = "block";
    }

    window.updateWeights = async function(workoutId, exerciseCount) {
      const user = auth.currentUser;
      if (!user) {
        console.error("User not authenticated");
        return;
      }

      const currentUserId = user.uid;
      const workoutRef = doc(db, "userWorkouts", currentUserId, "workouts", workoutId);

      const updatePromises = [];
      for (let i = 0; i < exerciseCount; i++) {
        const weightInput = document.getElementById(`weight-${i}`);
        const weight = parseFloat(weightInput.value) || 0;
        const exerciseId = document.getElementById(`exercise-id-${i}`).value;

        const exerciseRef = doc(workoutRef, "exercises", exerciseId);
        const updatePromise = updateDoc(exerciseRef, { weight: weight });
        updatePromises.push(updatePromise);
      }

      try {
        await Promise.all(updatePromises);
        console.log("Weights updated successfully");
      } catch (error) {
        console.error("Error updating weights:", error);
      }

      closePopup();
      loadUserWorkouts(currentUserId);
    };

    window.closePopup = function() {
      document.body.classList.remove("modal-open");
      document.getElementById("overlay").style.display = "none";
      document.getElementById("popup").style.display = "none";
    };

    document.addEventListener("DOMContentLoaded", function () {
      fetch('menu.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById("navbar-container").innerHTML = html;
          checkAuthState();
          initBurgerMenu();
        })
        .catch(err => {
          console.error("Error loading menu:", err);
          document.getElementById("navbar-container").innerHTML = `
            <span id="user-status">Please log in</span>
            <a href="login.html" id="login-link">Login</a>
            <button onclick="logoutUser()" id="logout-btn" style="display:none;">Logout</button>`;
          checkAuthState();
        });
    });

    function initBurgerMenu() {
      const menuToggle = document.querySelector(".menu-toggle");
      const navbarList = document.querySelector(".navbar-list");

      if (menuToggle && navbarList) {
        menuToggle.addEventListener("click", function () {
          navbarList.classList.toggle("active");
          menuToggle.classList.toggle("active");
        });
      }
    }
  </script>
</head>
<body>

  <div id="navbar-container"></div>
  <h1>Welcome to the Admin Page</h1>
  <div id="workouts-list"></div>

  <div id="overlay" onclick="closePopup()" style="display:none;"></div>
  <div id="popup" style="display:none;">
    <button class="close-btn" onclick="closePopup()">&times;</button>
    <div id="popup-content"></div>
  </div>

</body>
</html>
