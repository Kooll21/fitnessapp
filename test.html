<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тренировки</title>
  <style>
    /* Стили для модального окна */
    body.modal-open {
      overflow: hidden;
    }
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      z-index: 1000;
    }
    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      padding: 20px;
      max-width: 500px;
      z-index: 1001;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }
    .popup button {
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div id="user-status"></div>
  <div id="workouts-list"></div>

  <!-- Overlay для модального окна -->
  <div id="overlay"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-firestore.js";
    import { updateDoc } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCIXtcjkj6kLTqwStdD7RtMCuiycrKBH0k",
      authDomain: "fitnessapp-f519f.firebaseapp.com",
      projectId: "fitnessapp-f519f",
      storageBucket: "fitnessapp-f519f.appspot.com",
      messagingSenderId: "1000735476286",
      appId: "1:1000735476286:web:4a62a875917834dd215f6f",
      measurementId: "G-MJ8K8ZNQM4"
    };

    // Инициализация Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Проверка состояния аутентификации
    function checkAuthState() {
      onAuthStateChanged(auth, async (user) => {
        if (user) {
          await loadUserWorkouts(user.uid);
        } else {
          document.getElementById("user-status").textContent = 'Please log in';
        }
      });
    }

    // Загрузка тренировок пользователя
    async function loadUserWorkouts(userId) {
      const userWorkoutsRef = collection(db, "userWorkouts", userId, "workouts");
      const snapshot = await getDocs(userWorkoutsRef);
      const workouts = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
      displayWorkouts(workouts);
    }

    // Отображение тренировок на странице
    function displayWorkouts(workouts) {
      const container = document.getElementById("workouts-list");
      container.innerHTML = "<h2>Сохраненные тренировки</h2>";
      workouts.forEach((workout) => {
        const workoutElement = document.createElement("div");
        workoutElement.innerHTML = `
          <p><strong>Дата:</strong> ${new Date(workout.date.seconds * 1000).toLocaleDateString("ru-RU")}</p>
          <button onclick="showWorkoutDetails('${workout.id}')">Подробнее</button>
        `;
        container.appendChild(workoutElement);
      });
    }

    // Показ подробностей тренировки
    window.showWorkoutDetails = async function(workoutId) {
      const workoutRef = doc(db, "userWorkouts", auth.currentUser.uid, "workouts", workoutId);
      const workoutDoc = await getDoc(workoutRef);
      if (!workoutDoc.exists()) {
        console.log("Workout not found");
        return;
      }

      const workoutData = workoutDoc.data();
      workoutData.id = workoutId;

      // Отображаем упражнения
      let exercisesList = '';
      if (workoutData.exercises && workoutData.exercises.length > 0) {
        exercisesList = workoutData.exercises.map(exercise => `
          <li>
            <strong>${exercise.exercisename || "Unnamed Exercise"}</strong>: 
            <input type="number" value="${exercise.weight || ""}" id="weight-${workoutId}-${exercise.exercisename}" placeholder="Weight (kg)" /> кг,
            <span>${exercise.reps} повторений, ${exercise.sets} сета</span>
          </li>
        `).join("");
      } else {
        exercisesList = "Нет доступных упражнений";
      }

      const popupContent = `
        <h3>Детали тренировки</h3>
        <p><strong>Дата:</strong> ${new Date(workoutData.date.seconds * 1000).toLocaleDateString("ru-RU")}</p>
        <p><strong>Упражнения:</strong></p>
        <ul>${exercisesList}</ul>
        <button onclick="updateWorkout('${workoutId}')">Сохранить изменения</button>
      `;

      const popupElement = document.createElement('div');
      popupElement.id = popup-${workoutId};
      popupElement.classList.add('popup');
      popupElement.innerHTML = `
        <div class="popup-content">
          ${popupContent}
          <button onclick="closePopup('${workoutId}')">&times; Закрыть</button>
        </div>
      `;

      document.body.appendChild(popupElement);
      document.body.classList.add("modal-open");
      document.getElementById("overlay").style.display = "block";
      history.pushState(null, "", ?id=${workoutId});  // Обновление URL с ID тренировки
    };

    // Закрытие модального окна
    window.closePopup = function(popupId) {
      const popup = document.getElementById(popupId);
      if (popup) {
        popup.remove(); // Удаляем popup из DOM
      }
      document.body.classList.remove("modal-open");
      document.getElementById("overlay").style.display = "none";
      history.pushState(null, "", window.location.pathname);  // Сброс URL после закрытия
    };

    // Обновление тренировки
    window.updateWorkout = async function(workoutId) {
      const workoutRef = doc(db, "userWorkouts", auth.currentUser.uid, "workouts", workoutId);
      const workoutDoc = await getDoc(workoutRef);
      if (!workoutDoc.exists()) return;

      const workoutData = workoutDoc.data();
      workoutData.exercises.forEach(exercise => {
        const weightInput = document.getElementById(weight-${workoutId}-${exercise.exercisename});
        if (weightInput) {
          exercise.weight = parseFloat(weightInput.value);
        }
      });

      await updateDoc(workoutRef, {
        exercises: workoutData.exercises
      });

      alert("Данные тренировки обновлены!");
      closePopup(workoutId); // Закрытие окна после обновления
    };

    checkAuthState(); // Вызов для проверки аутентификации и загрузки данных
  </script>

</body>
</html>
