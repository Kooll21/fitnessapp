<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Page</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, query, orderBy, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCIXtcjkj6kLTqwStdD7RtMCuiycrKBH0k",
      authDomain: "fitnessapp-f519f.firebaseapp.com",
      projectId: "fitnessapp-f519f",
      storageBucket: "fitnessapp-f519f.appspot.com",
      messagingSenderId: "1000735476286",
      appId: "1:1000735476286:web:4a62a875917834dd215f6f",
      measurementId: "G-MJ8K8ZNQM4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Function to check authentication state
    function checkAuthState() {
      const adminButton = document.getElementById("admin-panel");
      const userStatus = document.getElementById("user-status");
      const loginLink = document.getElementById("login-link");
      const logoutBtn = document.getElementById("logout-btn");

      onAuthStateChanged(auth, async (user) => {
        if (user) {
          userStatus.textContent = `Welcome, ${user.email}`;
          loginLink.style.display = 'none';
          logoutBtn.style.display = 'block';
          adminButton.style.display = 'block';

          // Load user workouts
          await loadUserWorkouts(user.uid);
        } else {
          userStatus.textContent = 'Please log in';
          loginLink.style.display = 'inline-block';
          logoutBtn.style.display = 'none';
          adminButton.style.display = 'none';
        }
      });
    }

    window.logoutUser = function() {
      signOut(auth).then(() => {
        document.getElementById("user-status").textContent = 'Please log in';
        document.getElementById("login-link").style.display = 'inline-block';
        document.getElementById("logout-btn").style.display = 'none';
        document.getElementById("admin-panel").style.display = 'none';
      }).catch((error) => {
        console.error('Error logging out:', error);
      });
    };

    async function loadUserWorkouts(userId) {
      const userWorkoutsRef = collection(db, "userWorkouts", userId, "workouts");
      const q = query(userWorkoutsRef, orderBy("date", "desc"));
      const snapshot = await getDocs(q);
      let workouts = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));

      // Now, fetch exercises for each workout
      for (let workout of workouts) {
        if (workout.exerciseIds && workout.exerciseIds.length > 0) {
          workout.exercises = await loadExercises(workout.exerciseIds);
        }
      }

      displayWorkouts(workouts);
    }

    async function loadExercises(exerciseIds) {
      const exercises = [];

      for (let id of exerciseIds) {
        const exerciseRef = doc(db, "exercises", id); 
        const exerciseDoc = await getDoc(exerciseRef);

        if (exerciseDoc.exists()) {
          exercises.push(exerciseDoc.data()); 
        } else {
          console.error(`Exercise with ID ${id} not found.`);
        }
      }

      return exercises;
    }

    function displayWorkouts(workouts) {
      const container = document.getElementById("saved-workouts-content");
      container.innerHTML = "<h2>Сохраненные тренировки</h2>";

      workouts.forEach((workout, index) => {
        const workoutElement = document.createElement("div");
        workoutElement.innerHTML = `
          <p><strong>Тренировка № ${index + 1}:</strong> ${new Date(workout.date.seconds * 1000).toLocaleDateString("ru-RU")}</p>
        `;
        container.appendChild(workoutElement);
      });
    }

    // Toggle content based on clicks
    document.addEventListener("DOMContentLoaded", function() {
      const savedWorkoutsLink = document.getElementById('saved-workouts');
      const nutritionTrackerLink = document.getElementById('nutrition-tracker');
      const bodyWeightLink = document.getElementById('body-weight');

      const savedWorkoutsContent = document.getElementById('saved-workouts-content');
      const nutritionTrackerContent = document.getElementById('nutrition-tracker-content');
      const bodyWeightContent = document.getElementById('body-weight-content');

      // Function to hide all content sections
      function hideAllContent() {
        savedWorkoutsContent.classList.add('hidden');
        nutritionTrackerContent.classList.add('hidden');
        bodyWeightContent.classList.add('hidden');
      }

      // Event listeners to toggle content visibility
      savedWorkoutsLink.addEventListener('click', function() {
        hideAllContent();
        savedWorkoutsContent.classList.remove('hidden');
      });

      nutritionTrackerLink.addEventListener('click', function() {
        hideAllContent();
        nutritionTrackerContent.classList.remove('hidden');
      });

      bodyWeightLink.addEventListener('click', function() {
        hideAllContent();
        bodyWeightContent.classList.remove('hidden');
      });

      // Load saved workouts content on page load
      hideAllContent();
      savedWorkoutsContent.classList.remove('hidden');
    });

    // Show workout details in a popup
    function showWorkoutDetails(workout) {
      const workoutDetailsModal = document.getElementById('workout-details-modal');
      const workoutDetailsContent = document.getElementById('workout-details-content');
      
      workoutDetailsContent.innerHTML = `
        <h3>Workout Details</h3>
        <p><strong>Date:</strong> ${new Date(workout.date.seconds * 1000).toLocaleDateString("ru-RU")}</p>
        <p><strong>Exercises:</strong></p>
        <ul>
          ${workout.exercises.map(exercise => `
            <li>${exercise.name} (sets: ${exercise.sets}, reps: ${exercise.reps}, weight: ${exercise.weight} kg)</li>
          `).join('')}
        </ul>
      `;

      workoutDetailsModal.style.display = 'block';
    }

    function closeModal() {
      const workoutDetailsModal = document.getElementById('workout-details-modal');
      workoutDetailsModal.style.display = 'none';
    }

  </script>
  <style>
    .hidden {
      display: none;
    }

    .content-section {
      padding: 20px;
    }

    /* Modal styles */
    #workout-details-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
    }

    #workout-details-content {
      background: white;
      padding: 20px;
      border-radius: 8px;
      width: 80%;
      max-width: 600px;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <a href="#" id="saved-workouts">Сохраненные тренировки</a>
    <a href="#" id="nutrition-tracker">Трекер питания</a>
    <a href="#" id="body-weight">Вес тела</a>
  </div>

  <div class="main-content">
    <div id="saved-workouts-content" class="content-section hidden">
        <!-- Dynamic content for saved workouts will appear here -->
    </div>
    <div id="nutrition-tracker-content" class="content-section hidden">
        <h2>Трекер питания</h2>
        <p>Тестовый текст в разделе "Трекер питания"</p>
    </div>
    <div id="body-weight-content" class="content-section hidden">
        <h2>Вес тела</h2>
        <p>Тестовый текст в разделе "Вес тела"</p>
    </div>

    <!-- Modal for Workout Details -->
    <div id="workout-details-modal">
      <div id="workout-details-content">
        <button onclick="closeModal()">Close</button>
        <!-- Dynamic workout details will be injected here -->
      </div>
    </div>
  </div>

</body>
</html>
