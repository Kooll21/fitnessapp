<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fitness Tracker</title>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-firestore.js"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Навигационная панель -->
    <nav class="navbar">
        <div id="navbar-container"></div>
    </nav>

    <!-- Основной контент -->
    <div class="main-content">
        <header>
            <h1>Вход</h1>
            <p>Войдите в свой аккаунт, чтобы продолжить фитнес-путешествие!</p>
        </header>

        <section class="content">
            <form id="login-form" class="feature-card">
                <h3>Введите данные</h3>
                <label for="email">Email:</label>
                <input type="email" id="email" required placeholder="example@domain.com">

                <label for="password">Пароль:</label>
                <input type="password" id="password" required placeholder="Введите ваш пароль">

                <button type="submit">Войти</button>
            </form>
            <p id="error-message" style="color: #e74c3c; text-align: center; margin-top: 15px;"></p>
        </section>

        <footer>
            <p>© 2025 Фитнес Приложение. Все права защищены.</p>
        </footer>
    </div>

    <!-- Скрипты -->
    <script type="module" src="auth.js"></script>
    <script type="module" src="menu.js"></script>
    <script type="module">
        import { loadNavbar, loginUser } from './auth.js';

        document.addEventListener("DOMContentLoaded", () => {
            loadNavbar(); // Загружаем navbar синхронно
        });

        document.getElementById("login-form").addEventListener("submit", (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const errorMessage = document.getElementById("error-message");

            loginUser(email, password)
                .then(() => {
                    window.location.href = "admin.html";
                })
                .catch((error) => {
                    errorMessage.textContent = "Не удалось войти: " + error.message;
                });
        });
    </script>
</body>
</html>
