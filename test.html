<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidebar Example</title>
  <style>
    /* Basic styles for the sidebar and page content */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
    }

    /* Sidebar styling */
    .sidebar {
      width: 250px;
      height: 100vh;
      background-color: #333;
      color: white;
      padding: 15px;
      box-sizing: border-box;
    }

    .sidebar button {
      width: 100%;
      padding: 15px;
      background-color: #444;
      color: white;
      border: none;
      margin: 10px 0;
      cursor: pointer;
    }

    .sidebar button:hover {
      background-color: #555;
    }

    /* Content area styling */
    .content {
      flex-grow: 1;
      padding: 20px;
    }

    .content h2 {
      margin: 0;
    }

    .content p {
      font-size: 18px;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <button onclick="showContent('Content for Button 1')">Button 1</button>
    <button onclick="showContent('Content for Button 2')">Button 2</button>
    <button onclick="showContent('Content for Button 3')">Button 3</button>
  </div>

  <!-- Content area -->
  <div class="content">
    <h2>Test Content</h2>
    <p id="content-text">Click a button to see some content.</p>
  </div>

  <script>
    // Function to display content based on the button clicked
    function showContent(content) {
      document.getElementById('content-text').textContent = content;
    }
  </script>

</body>
</html>
