<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Page</title>
  <style>
    /* Styles for the modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
    }
    .modal-content {
      background-color: white;
      margin: 15% auto;
      padding: 20px;
      width: 50%;
      border-radius: 10px;
    }
    .close {
      float: right;
      font-size: 20px;
      cursor: pointer;
    }
  </style>
  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-auth.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCIXtcjkj6kLTqwStdD7RtMCuiycrKBH0k",
      authDomain: "fitnessapp-f519f.firebaseapp.com",
      projectId: "fitnessapp-f519f",
      storageBucket: "fitnessapp-f519f.appspot.com",
      messagingSenderId: "1000735476286",
      appId: "1:1000735476286:web:4a62a875917834dd215f6f",
      measurementId: "G-MJ8K8ZNQM4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    function checkAuthState() {
      const adminButton = document.getElementById("admin-panel");
      const userStatus = document.getElementById("user-status");
      const loginLink = document.getElementById("login-link");
      const logoutBtn = document.getElementById("logout-btn");

      onAuthStateChanged(auth, (user) => {
        if (user) {
          userStatus.textContent = `Welcome, ${user.email}`;
          loginLink.style.display = 'none';
          logoutBtn.style.display = 'block';
          adminButton.style.display = 'block';
          loadUserWorkouts(user.uid);
        } else {
          userStatus.textContent = 'Please log in';
          loginLink.style.display = 'inline-block';
          logoutBtn.style.display = 'none';
          adminButton.style.display = 'none';
        }
      });
    }

    window.logoutUser = function() {
      signOut(auth)
        .then(() => {
          document.getElementById("user-status").textContent = 'Please log in';
          document.getElementById("login-link").style.display = 'inline-block';
          document.getElementById("logout-btn").style.display = 'none';
          document.getElementById("admin-panel").style.display = 'none';
        })
        .catch((error) => {
          console.error('Error logging out:', error);
        });
    };

    async function loadUserWorkouts(userId) {
      const workoutsRef = collection(db, "userWorkouts", userId, "workouts");
      const snapshot = await getDocs(workoutsRef);
      let workouts = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
      displayWorkouts(workouts);
    }

    function displayWorkouts(workouts) {
      const container = document.getElementById("workouts-list");
      container.innerHTML = "<h2>Saved Workouts</h2>";
      workouts.forEach((workout, index) => {
        const workoutDate = new Date(workout.date.seconds * 1000).toLocaleDateString("ru-RU");
        const workoutElement = document.createElement("div");
        workoutElement.innerHTML = `
          <p><strong>№ ${index + 1}:</strong> ${workoutDate} - Тренировка выполнена
            <button onclick="openModal('${workout.id}')">View Details</button>
          </p>
        `;
        container.appendChild(workoutElement);
      });
    }

    window.openModal = function(workoutId) {
      const modal = document.getElementById("workout-modal");
      const modalContent = document.getElementById("modal-content");
      const workout = document.querySelector(`[data-id='${workoutId}']`);
      if (workout) {
        modalContent.innerHTML = workout.innerHTML;
        modal.style.display = "block";
      }
    };

    window.closeModal = function() {
      document.getElementById("workout-modal").style.display = "none";
    };
  </script>
</head>
<body>
  <div id="navbar-container"></div>
  <h1>Welcome to the Admin Page</h1>
  <div id="workouts-list"></div>

  <!-- Modal for workout details -->
  <div id="workout-modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <div id="modal-content"></div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      checkAuthState();
    });
  </script>
</body>
</html>
